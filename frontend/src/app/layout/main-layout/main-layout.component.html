<mat-sidenav-container class="main-container">
  <mat-sidenav #drawer mode="side" class="main-sidenav" fixedInViewport [opened]="true">
    <mat-toolbar color="primary" class="sidenav-header">eSimulate</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active"><mat-icon>dashboard</mat-icon> Dashboard</a>
      <a mat-list-item routerLink="/simulados" routerLinkActive="active"><mat-icon>assignment</mat-icon> Simulados</a>
      <a mat-list-item routerLink="/questoes" routerLinkActive="active"><mat-icon>help</mat-icon> Questões</a>
      <a mat-list-item routerLink="/perfil" routerLinkActive="active"><mat-icon>person</mat-icon> Perfil</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="main-toolbar">
      <button mat-icon-button (click)="drawer.toggle()" class="hide-desktop">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-title">eSimulate</span>
      <span class="spacer"></span>
      <span *ngIf="(user$ | async) as user" class="user-name">{{ user.name }}</span>
      <button mat-icon-button (click)="logout()"><mat-icon>logout</mat-icon></button>
    </mat-toolbar>
    <mat-progress-bar *ngIf="loading$ | async" mode="indeterminate" color="accent" style="position:fixed;top:0;left:0;width:100%;z-index:1000;"></mat-progress-bar>
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
