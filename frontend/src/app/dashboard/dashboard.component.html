<div class="dashboard-container">
  <mat-card class="dashboard-card">
    <mat-card-title>Bem-vindo ao eSimulate!</mat-card-title>
    <mat-card-content>
      <div class="dashboard-summary">
        <mat-card class="summary-item">
          <mat-icon>assignment</mat-icon>
          <div>
            <div class="summary-value">--</div>
            <div class="summary-label">Simulados Realizados</div>
          </div>
        </mat-card>
        <mat-card class="summary-item">
          <mat-icon>check_circle</mat-icon>
          <div>
            <div class="summary-value">--%</div>
            <div class="summary-label">Desempenho</div>
          </div>
        </mat-card>
        <mat-card class="summary-item">
          <mat-icon>history</mat-icon>
          <div>
            <div class="summary-value">--</div>
            <div class="summary-label">Últimos Simulados</div>
          </div>
        </mat-card>
      </div>
      <div class="dashboard-graph">
        <!-- Placeholder para gráfico de desempenho -->
        <mat-card>
          <mat-card-title>Gráfico de Desempenho</mat-card-title>
          <div style="height: 200px; display: flex; align-items: center; justify-content: center; color: #888;">
            (Em breve)
          </div>
        </mat-card>
      </div>
      <div class="dashboard-history">
        <mat-card>
          <mat-card-title>Histórico Recente</mat-card-title>
          <div style="color: #888;">(Em breve)</div>
        </mat-card>
      </div>
    </mat-card-content>
  </mat-card>
</div>
